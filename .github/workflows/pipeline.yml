name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || true

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploy step"